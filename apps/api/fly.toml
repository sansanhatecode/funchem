# fly launch --no-deploy đã được thay bằng file này; sửa app và region khi tạo app thật
app = "funchem-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  # build context là gốc monorepo: chạy `fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile .` từ gốc repo

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
