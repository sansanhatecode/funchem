name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: funchem
          POSTGRES_PASSWORD: funchem
          POSTGRES_DB: funchem_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U funchem" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://funchem:funchem@localhost:5432/funchem_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test
      - name: Install browser for e2e
        run: pnpm --filter @funchem/web exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm e2e
        env:
          E2E_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
